name: Build ZENIX CLIENT (from ZIP)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (plain files or ZIP archive)
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          find . -type f ! -path './.git/*' | head -80

          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p "$GITHUB_WORKSPACE/_project"
          FOUND=""

          while IFS= read -r -d '' f; do
            if unzip -tq "$f" >/dev/null 2>&1 &&
               unzip -Z1 "$f" | grep -Eq '(^|/)build\.gradle(\.kts)?$'; then
              FOUND="$f"
              break
            fi
          done < <(
            find . -type f \
              ! -path './.git/*' \
              ! -path './.github/*' \
              -size +20k -print0
          )

          if [ -z "$FOUND" ]; then
            echo "ERROR: No Gradle project or ZIP archive containing build.gradle was found."
            exit 1
          fi

          echo "Archive: $FOUND"
          unzip -oq "$FOUND" -d "$GITHUB_WORKSPACE/_project"

          B=$(find "$GITHUB_WORKSPACE/_project" \
            -maxdepth 5 \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -type f | head -1)

          if [ -z "$B" ]; then
            echo "ERROR: Gradle build file not found after extraction."
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$B")" >> "$GITHUB_ENV"
          echo "Selected build file: $B"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Show Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Project directory ==="
          pwd
          echo "=== Gradle build files ==="
          ls -la build.gradle* settings.gradle* gradle.properties 2>/dev/null || true
          echo "=== Fabric Loom declarations ==="
          grep -n -E 'fabric-loom|minecraft|fabric-loader|archives_base_name|archivesName' \
            build.gradle build.gradle.kts gradle.properties 2>/dev/null || true

      - name: Validate Fabric metadata
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          FILE="src/main/resources/fabric.mod.json"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: $FILE not found."
            find src -maxdepth 5 -type f 2>/dev/null | head -100 || true
            exit 1
          fi

          python3 -m json.tool "$FILE" >/dev/null
          echo "fabric.mod.json is valid JSON."

      - name: Build mod and sources JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Verify JAR contents (diagnostic)
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -uo pipefail

          echo "=== Project directory ==="
          pwd

          echo "=== Java sources ==="
          find src -type f -name '*.java' 2>/dev/null | head -100 || true

          echo "=== Compiled classes ==="
          find build/classes -type f -name '*.class' 2>/dev/null | head -100 || true

          echo "=== Build output ==="
          if [ ! -d build/libs ]; then
            echo "ERROR: build/libs does not exist."
            exit 1
          fi

          ls -lah build/libs

          shopt -s nullglob
          JARS=(build/libs/*.jar)

          if [ ${#JARS[@]} -eq 0 ]; then
            echo "ERROR: No JAR files were generated."
            exit 1
          fi

          for J in "${JARS[@]}"; do
            echo
            echo "=== Contents: $J ==="
            unzip -l "$J" | head -100 || true
          done

          MAIN_JAR=""

          for J in "${JARS[@]}"; do
            if [[ "$J" != *-sources.jar ]] &&
               unzip -Z1 "$J" | grep -qx 'fabric.mod.json'; then
              MAIN_JAR="$J"
              break
            fi
          done

          if [ -z "$MAIN_JAR" ]; then
            echo "ERROR: No non-sources JAR containing fabric.mod.json was found."
            exit 1
          fi

          echo
          echo "Selected main JAR: $MAIN_JAR"

          unzip -Z1 "$MAIN_JAR" > jar.txt

          echo "=== ZENIX-related entries ==="
          grep -iE 'zenix|AttackAura|BaseFinder|BotsScreen|fabric\.mod\.json' \
            jar.txt | head -150 || true

          MISSING=0

          for f in \
            fabric.mod.json \
            gg/zenix/client/ZenixClient.class \
            gg/zenix/client/modules/AttackAuraModule.class \
            gg/zenix/client/modules/BaseFinderModule.class \
            gg/zenix/client/bots/BotsScreen.class
          do
            if grep -Fxq "$f" jar.txt; then
              echo "FOUND: $f"
            else
              echo "MISSING: $f"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo
            echo "WARNING: Some expected classes are missing."
            echo "The diagnostic output above will help identify the actual package names and compiled files."
            exit 1
          fi

          echo "All expected classes were found."

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zenix-client-0.3.5-dev
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 7
