name: Build ZENIX CLIENT

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Validate Fabric metadata
        run: python3 -m json.tool src/main/resources/fabric.mod.json > /dev/null
      - name: Build mod and sources JAR
        run: gradle --no-daemon clean build
      - name: Verify JAR contents (fail if core classes are missing)
        run: |
          J=$(ls build/libs/zenix-client-*.jar | grep -v sources | head -1)
          unzip -l "$J" > jar.txt
          for f in fabric.mod.json gg/zenix/client/ZenixClient.class gg/zenix/client/modules/AttackAuraModule.class gg/zenix/client/modules/BaseFinderModule.class gg/zenix/client/bots/BotsScreen.class; do
            grep -q "$f" jar.txt || { echo "MISSING in JAR: $f"; exit 1; }
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenix-client-0.3.5-dev
          path: |
            build/libs/*.jar
          if-no-files-found: error
