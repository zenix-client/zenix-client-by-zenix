name: Build ZENIX CLIENT (from ZIP)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unpack project archive
        run: |
          A=$(ls *.zip *.bin 2>/dev/null | head -1)
          [ -n "$A" ] || { echo "No .zip/.bin archive in repository root"; exit 1; }
          echo "Archive: $A"
          mkdir -p project
          unzip -oq "$A" -d project
          B=$(find project -maxdepth 3 -name build.gradle | head -1)
          [ -n "$B" ] || { echo "build.gradle not found after unpacking"; ls -R project | head -60; exit 1; }
          echo "PROJECT_DIR=$(dirname "$B")" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Fabric metadata
        run: python3 -m json.tool "$PROJECT_DIR/src/main/resources/fabric.mod.json" > /dev/null

      - name: Build mod and sources JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Verify JAR contents
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          J=$(ls build/libs/zenix-client-*.jar | grep -v sources | head -1)
          unzip -l "$J" > jar.txt
          for f in fabric.mod.json gg/zenix/client/ZenixClient.class gg/zenix/client/modules/AttackAuraModule.class gg/zenix/client/modules/BaseFinderModule.class gg/zenix/client/bots/BotsScreen.class; do
            grep -q "$f" jar.txt || { echo "MISSING in JAR: $f"; exit 1; }
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenix-client-0.3.5-dev
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
