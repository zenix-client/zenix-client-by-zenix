name: Build ZENIX CLIENT (from ZIP)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project (plain files or any zip archive)
        run: |
          echo "=== Files in repository ==="
          find . -type f ! -path './.git/*' | head -80
          echo "==========================="
          if [ -f build.gradle ]; then
            echo "Project already unpacked in repository root"
            echo "PROJECT_DIR=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
            exit 0
          fi
          FOUND=""
          while IFS= read -r f; do
            if unzip -tq "$f" >/dev/null 2>&1 && unzip -l "$f" | grep -q "build.gradle"; then
              FOUND="$f"; break
            fi
          done < <(find . -type f ! -path './.git/*' ! -path './.github/*' -size +20k)
          if [ -z "$FOUND" ]; then
            echo "ERROR: no build.gradle and no zip archive containing it was found."
            exit 1
          fi
          echo "Archive: $FOUND"
          mkdir -p "$GITHUB_WORKSPACE/_project"
          unzip -oq "$FOUND" -d "$GITHUB_WORKSPACE/_project"
          B=$(find "$GITHUB_WORKSPACE/_project" -maxdepth 3 -name build.gradle ! -path '*/ZENIX-CLIENT/*' | head -1)
          if [ -z "$B" ]; then B=$(find "$GITHUB_WORKSPACE/_project" -maxdepth 4 -name build.gradle | head -1); fi
          [ -n "$B" ] || { echo "build.gradle not found after unpacking"; exit 1; }
          echo "PROJECT_DIR=$(dirname "$B")" >> "$GITHUB_ENV"

      - name: Pin Fabric Loom version
        run: |
          cd "$PROJECT_DIR"
          sed -i -E "s/id ['\"]fabric-loom['\"] version ['\"][^'\"]*['\"]/id 'fabric-loom' version '1.9-SNAPSHOT'/" build.gradle
          grep -n "fabric-loom" build.gradle

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Validate Fabric metadata
        run: python3 -m json.tool "$PROJECT_DIR/src/main/resources/fabric.mod.json" > /dev/null

      - name: Build mod and sources JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build

      - name: Verify JAR contents
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          J=$(ls build/libs/zenix-client-*.jar | grep -v sources | head -1)
          unzip -l "$J" > jar.txt
          for f in fabric.mod.json gg/zenix/client/ZenixClient.class gg/zenix/client/modules/AttackAuraModule.class gg/zenix/client/modules/BaseFinderModule.class gg/zenix/client/bots/BotsScreen.class; do
            grep -q "$f" jar.txt || { echo "MISSING in JAR: $f"; exit 1; }
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zenix-client-0.3.5-dev
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
